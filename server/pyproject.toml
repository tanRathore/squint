[project]
name = "squint"
version = "0.2.0"
description = "press a button you already have, find out if what you're looking at is synthetic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "numpy>=1.26",
    "imagehash>=4.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
onnx = ["onnxruntime>=1.18"]
postgres = ["psycopg[binary]>=3.2"]
push = ["PyJWT[crypto]>=2.8", "httpx[http2]>=0.27"]
heic = ["pillow-heif>=0.16"]
text = ["scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
squint = "squint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["squint*"]

[tool.setuptools.package-data]
squint = ["dashboard.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
