name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e "server[dev,onnx,text]"
      - run: pytest -q server/tests
      - run: pip install onnxruntime && pytest -q research/test_research.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: cd android && gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: squint-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t squint:ci server
      - run: |
          docker run -d --name sq -p 8080:8080 -e SQUINT_DB_URL=sqlite:////tmp/t.db squint:ci
          sleep 6
          curl -fsS localhost:8080/healthz
